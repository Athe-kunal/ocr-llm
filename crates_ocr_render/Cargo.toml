[package]
name = "ocr_render_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "ocr_render_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
